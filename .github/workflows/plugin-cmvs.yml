name: Build experimental CMVS plugin

on:
  push:
    branches: [main]
    paths: ["plugins/cmvs/**", ".github/workflows/plugin-cmvs.yml", "scripts/verify-plugin-apk.sh"]
  pull_request:
    paths: ["plugins/cmvs/**", ".github/workflows/plugin-cmvs.yml", "scripts/verify-plugin-apk.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build partial native CMVS interpreter
        run: ./gradlew -p plugins/cmvs :app:assembleDebug --stacktrace
      - name: Verify packaged plugin contract
        run: bash scripts/verify-plugin-apk.sh plugins/cmvs/app/build/outputs/apk/debug/app-debug.apk cmvs
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-plugin-cmvs-debug-apk
          path: plugins/cmvs/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
