name: Conformance on an emulator

# Conformance layer 1b (docs/conformance-test-games.md, "Layer 1b"; Droidtop/tracker#27): this
# commit's Enginehost and each family's published unstable core run the MIT test games in
# test-games/ on an x86_64 emulator, through the core harness (docs/core-harness.md). Nightly, and
# by hand on any branch. It plays only the games written for it: games from the owner's library are
# tested on the rig, never here.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  # A change to the harness (its scripts and the debug build's adb hooks), the test games or this
  # workflow is run where it is pushed.
  push:
    paths:
      - ".github/workflows/conformance-emulator.yml"
      - "tools/core-harness/**"
      - "app/src/debug/**"
      - "test-games/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # The debug build carries the adb harness (src/debug); with no keystore it is signed with
      # the default debug key, which an emulator takes as it is.
      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Each family's rolling unstable core: the build its users get next. One core per family
      # whose test game in this repository runs as it is (Ren'Py's needs the SDK's runtime beside
      # it, Godot's needs exporting to a .pck; both wait for that).
      - name: Fetch the cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cores
          while read -r repo tag; do
            gh release download "$tag" -R "Droidtop/$repo" -p '*.enginehost.tar.xz' -D cores
          done <<'EOF'
          enginehost-html-plugin html-v1-unstable
          enginehost-love2d-plugin love2d-11-v1-unstable
          enginehost-nscripter-plugin nscripter-onsyuri-v1-unstable
          EOF
          ls -l cores

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the test games
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/core-harness/conformance-emulator.sh app/build/outputs/apk/debug/app-debug.apk cores results

      # The report as the run's summary: read where the logs' download is refused.
      - name: Summarise
        if: always()
        run: |
          if [ -f results/report.md ]; then cat results/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report was written." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-emulator
          path: results
          if-no-files-found: warn
