name: Conformance on an emulator

# Conformance layer 1b (docs/conformance-test-games.md, "Layer 1b"; Droidtop/tracker#27): this
# commit's Enginehost and each family's published unstable core run the MIT test games in
# test-games/ on an x86_64 emulator, through the core harness (docs/core-harness.md). Nightly, and
# by hand on any branch. It plays only the games written for it: games from the owner's library are
# tested on the rig, never here.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      lockdown:
        # The #550 rollout's middle step for a core that runs unsandboxed: play its test game
        # with the lockdown forced on (debug.enginehost.lockdown 1), before it declares
        # "lockdown": true. Off for the nightly and push runs.
        description: Force the process lockdown on for every core
        type: boolean
        default: false
  # A change to the harness (its scripts and the debug build's adb hooks), the test games or this
  # workflow is run where it is pushed.
  push:
    paths:
      - ".github/workflows/conformance-emulator.yml"
      - "tools/core-harness/**"
      - "app/src/debug/**"
      - "test-games/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # The debug build carries the adb harness (src/debug); with no keystore it is signed with
      # the default debug key, which an emulator takes as it is.
      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Each family's rolling unstable core: the build its users get next. One core per family
      # whose test game in this repository plays on the emulator. Godot's is exported below but
      # cannot draw here (see the export step). Ren'Py's runs on its 8.3 core here but shows only
      # black: the emulator's GLES fails its buffer unmaps ("GL2Encoder ... s_glUnmapBuffer ... GL
      # error 0x502", run 40891140086), so it is played on the rig.
      - name: Fetch the cores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cores
          while read -r repo tag; do
            gh release download "$tag" -R "Droidtop/$repo" -p '*.enginehost.tar.xz' -D cores
          done <<'EOF'
          enginehost-html-plugin html-v1-unstable
          enginehost-love2d-plugin love2d-11-v1-unstable
          enginehost-nscripter-plugin nscripter-onsyuri-v1-unstable
          EOF
          ls -l cores

      # The Godot core runs only an exported game, a .pck: the test game's project is exported
      # with Godot's own editor, a pinned release whose archive is checked before it runs. The pack
      # is not played here: the emulator's GL allows 261 fragment uniforms and Godot 4.4's canvas
      # shader needs more ("Program linking failed", run 40859254846; the guest GPU is the same,
      # run 40860194007), so only the clear colour is ever drawn. It goes into the run's artifact for
      # the rig, and this step proves the test game still exports.
      - name: Export the Godot test game
        env:
          GODOT_ZIP: Godot_v4.4.1-stable_linux.x86_64.zip
          GODOT_SHA256: d6e382fb531019f85630c1f485a561a0d20c4a2344b6c3847735cfee7da812aa
        run: |
          mkdir -p godot-editor godot-export
          curl -fsSL -o "godot-editor/$GODOT_ZIP" "https://github.com/godotengine/godot/releases/download/4.4.1-stable/$GODOT_ZIP"
          echo "$GODOT_SHA256  godot-editor/$GODOT_ZIP" | sha256sum -c -
          unzip -q "godot-editor/$GODOT_ZIP" -d godot-editor
          editor=godot-editor/Godot_v4.4.1-stable_linux.x86_64
          "$editor" --headless --path test-games/godot --import
          "$editor" --headless --path test-games/godot --export-pack pack "$PWD/godot-export/game.pck"
          # A Godot pack starts with GDPC.
          test "$(head -c 4 godot-export/game.pck)" = GDPC
          ls -l godot-export

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the test games
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          # The plain AOSP image: Google Play services' processes come and go on an emulator, and
          # Android kills every app process using one of their providers when they do. WebView in
          # the HTML game's runtime used Play services' font provider, and the run of 2026-10-29
          # (40834905579) lost the game mid-play to "depends on provider ... FontsProvider in
          # dying proc com.google.android.gms.persistent". AOSP has WebView and no Play services.
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: LOCKDOWN=${{ inputs.lockdown && '1' || '' }} bash tools/core-harness/conformance-emulator.sh app/build/outputs/apk/debug/app-debug.apk cores results

      # The report as the run's summary: read where the logs' download is refused.
      - name: Summarise
        if: always()
        run: |
          if [ -f results/report.md ]; then cat results/report.md >> "$GITHUB_STEP_SUMMARY"; else echo "No report was written." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-emulator
          path: |
            results
            godot-export
          if-no-files-found: warn
