name: Re-sign a stable engine release

# Signs the bundle of an already published stable release in format v1 and
# publishes the result as a new stable release beside it
# (owner, 2026-10-16, Droidtop/tracker#550). The September stable releases carry
# only the legacy signature, which Enginehost no longer accepts for an install;
# their code was verified on hardware when they were promoted, so they are
# re-signed rather than rebuilt: the manifest bytes, and with them every payload
# file's digest and the build number, stay exactly as published, and the
# published release is left as it is. scripts/resign-engine-bundle.py does it,
# and leaves the legacy enginehost-bundle.sig out (Droidtop/tracker#768).
#
# With only-64-bit (a newer pluginVersion), the same release is published again
# without its 32-bit libraries, as <source-tag>-64-bit: the 64-bit code is the
# published code byte for byte, and the manifest and signature are new
# (owner, 2026-10-30, Droidtop/tracker#646).
#
# With rekey (signing-root rotation 2026-11-04, Droidtop/tracker#876 and #550; owner: "Yes,
# replace each release"), no new release is made: each named release (source-tag is a list
# of tags separated by spaces or commas, or "all") has its signed assets replaced in place,
# same tag, same flags, with `gh release upload --clobber`: the re-keyed bundle (only its
# enginehost-bundle.jws differs, the manifest and every other file are the published ones),
# the release envelope with the new jws, and enginehost-signing-certificate.pem, the
# repository's new certificate. enginehost-public-key.json, the legacy key document of the
# old seed that no official origin uses any more, is deleted from the release. Each release is
# re-downloaded and verified against the new root alone before the next one is touched. A
# release with no bundle, a draft, or a bundle with no v1 signature is skipped and the run
# says so. The job that holds the key signs everything first and verifies it; the job that
# writes the releases never sees the key. Dispatch the caller on the branch holding the
# repository's new committed certificate (ci/key-rotation-cert).
#
# A core repository calls it from a dispatch-only workflow, pinned by commit:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         source-tag: { description: "The stable release to re-sign; with rekey, tags separated by spaces, or all", required: true }
#         rekey: { description: "Replace the v1 signature of each named release in place, under the new root", type: boolean, default: false }
#   jobs:
#     resign:
#       permissions:
#         contents: write
#       uses: Droidtop/enginehost/.github/workflows/resign-engine-release.yml@<sha>
#       with:
#         tooling-sha: <the same sha>
#         source-tag: ${{ inputs.source-tag }}
#         rekey: ${{ inputs.rekey }}
#       secrets:
#         ENGINEHOST_CERTIFICATE_KEY_PEM: ${{ secrets.ENGINEHOST_CERTIFICATE_KEY_PEM }}
#         PLATFORMS_DISPATCH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
#
# As in sign-engine-bundle.yml and publish-engine-bundle.yml, the job holding
# the key only reads and uploads an artifact, and the job that writes the
# release never sees the key.
on:
  workflow_call:
    inputs:
      tooling-sha:
        description: Full commit SHA of Droidtop/enginehost whose scripts/ re-sign; the commit this workflow is pinned to.
        type: string
        required: true
      source-tag:
        description: >-
          The published stable release whose bundle is re-signed. With rekey: the tags of
          the releases to re-key in place, separated by spaces or commas, or "all".
        type: string
        required: true
      tag:
        description: Tag of the new stable release (default <source-tag>-resigned, or <source-tag>-64-bit with only-64-bit).
        type: string
        default: ""
      only-64-bit:
        description: >-
          A pluginVersion newer than the source's: re-sign without every 32-bit
          library, in the bundle and in its resource APKs, and publish under this
          version (owner, 2026-10-30, Droidtop/tracker#646). Empty re-signs the
          bundle unchanged.
        type: string
        default: ""
      rekey:
        description: >-
          Replace, in each named release, the v1 signature with one by the repository's new
          certificate under the new Enginehost root, uploading over the release's assets
          (same tag, same flags). Nothing but the signature changes. Does not combine with
          only-64-bit or tag.
        type: boolean
        default: false
      repository-certificate:
        description: >-
          The repository's committed signing certificate, relative to its root, as checked out
          on the ref the caller runs on. For rekey it is the new one (issued under the new root).
        type: string
        default: enginehost-signing-certificate.pem
    secrets:
      ENGINEHOST_CERTIFICATE_KEY_PEM:
        description: The private key of the repository's signing certificate.
        required: true
      PLATFORMS_DISPATCH_TOKEN:
        description: Lets the publish job ask droidtop-platforms to reindex; without it the index picks the release up on its schedule.
        required: false

permissions:
  contents: read

jobs:
  resign:
    if: ${{ !inputs.rekey }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          TAG: ${{ inputs.tag }}
          CERTIFICATE: ${{ inputs.repository-certificate }}
          ONLY_64_BIT: ${{ inputs.only-64-bit }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "tooling-sha must be a full commit SHA, got '$TOOLING_SHA'" >&2; exit 1; }
          [[ "$SOURCE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad source tag '$SOURCE_TAG'" >&2; exit 1; }
          [[ -z "$TAG" || "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad tag '$TAG'" >&2; exit 1; }
          [[ "$CERTIFICATE" =~ ^[A-Za-z0-9._/-]+$ && "$CERTIFICATE" != *..* ]] || { echo "bad certificate path '$CERTIFICATE'" >&2; exit 1; }
          [[ -z "$ONLY_64_BIT" || "$ONLY_64_BIT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "bad version '$ONLY_64_BIT'" >&2; exit 1; }
      - name: Check out the repository's signing certificate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: repository
          persist-credentials: false
          sparse-checkout: ${{ inputs.repository-certificate }}
          sparse-checkout-cone-mode: false
      - name: Check out the signing tooling and the pinned root key
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Droidtop/enginehost
          ref: ${{ inputs.tooling-sha }}
          path: enginehost-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts
            app/src/main/assets/trust
      - name: Download the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source-tag }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_TAG")"
          # Only a published stable release: a draft or a pre-release is a
          # testing or unstable build, which is rebuilt, not re-signed.
          printf '%s' "$release" | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if not r["draft"] and not r["prerelease"] else 1)' \
            || { echo "::error::$SOURCE_TAG is not a published stable release" >&2; exit 1; }
          mkdir -p source
          printf '%s' "$release" | python3 -c 'import json,sys; [print(a["id"], a["name"]) for a in json.load(sys.stdin)["assets"]]' |
          while read -r id name; do
            case "$name" in
              *.enginehost.tar.xz|enginehost-release.json|enginehost-component.json|enginehost-public-key.json)
                [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad asset name '$name'" >&2; exit 1; }
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "source/$name" ;;
            esac
          done
          ls -l source
          test -n "$(find source -name '*.enginehost.tar.xz' -print -quit)"
      - name: Re-sign
        env:
          ENGINEHOST_CERTIFICATE_KEY_PEM: ${{ secrets.ENGINEHOST_CERTIFICATE_KEY_PEM }}
          CERTIFICATE: repository/${{ inputs.repository-certificate }}
          TRUST_DIR: enginehost-tooling/app/src/main/assets/trust
          ONLY_64_BIT: ${{ inputs.only-64-bit }}
        run: |
          set -euo pipefail
          test -n "$ENGINEHOST_CERTIFICATE_KEY_PEM" || { echo "::error::ENGINEHOST_CERTIFICATE_KEY_PEM is not set" >&2; exit 1; }
          test -f "$CERTIFICATE" || { echo "::error::$CERTIFICATE is not committed" >&2; exit 1; }
          test -f "$TRUST_DIR/enginehost-roots.json"
          key="$RUNNER_TEMP/certificate-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s' "$ENGINEHOST_CERTIFICATE_KEY_PEM" > "$key")
          envelope="$(find source \( -name enginehost-release.json -o -name enginehost-component.json \) -print -quit)"
          test -f "$envelope"
          mkdir -p output
          only=()
          [ -z "$ONLY_64_BIT" ] || only=(--only-64-bit "$ONLY_64_BIT")
          for bundle in source/*.enginehost.tar.xz; do
            python3 enginehost-tooling/scripts/resign-engine-bundle.py "$bundle" \
              --certificate-key "$key" --certificate-chain "$CERTIFICATE" \
              --output output --release-envelope "$envelope" "${only[@]}"
            # The envelope now carries this bundle's jws; the next bundle (if
            # any) adds its own to the same file.
            envelope="output/$(basename "$envelope")"
          done
          for bundle in output/*.enginehost.tar.xz; do
            python3 enginehost-tooling/scripts/verify-engine-bundle.py "$bundle" --trust-dir "$TRUST_DIR"
          done
          [ ! -f source/enginehost-public-key.json ] || cp source/enginehost-public-key.json output/
          cp "$CERTIFICATE" output/enginehost-signing-certificate.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resigned
          path: output/*
          if-no-files-found: error

  publish:
    needs: resign
    if: ${{ !inputs.rekey }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resigned
          path: release
      - name: Publish the re-signed stable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          TAG: ${{ inputs.tag }}
          ONLY_64_BIT: ${{ inputs.only-64-bit }}
        run: |
          set -euo pipefail
          if [ -n "$ONLY_64_BIT" ]; then tag="${TAG:-$SOURCE_TAG-64-bit}"; else tag="${TAG:-$SOURCE_TAG-resigned}"; fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists" >&2
            exit 1
          fi
          source="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_TAG")"
          title="$(printf '%s' "$source" | python3 -c 'import json,sys; r=json.load(sys.stdin); print(r["name"] or r["tag_name"])')"
          # The commit the code was built from is the source tag's; the notes
          # name it. The new tag itself points at this run's commit: GitHub
          # refuses this job's token a tag at an older commit whose workflow
          # files differ from today's (HTTP 403 without the workflows
          # permission), as it allows one at the commit the run is on, which
          # is what every regular publish tags.
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_TAG" --jq .sha)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          envelope="$(find release \( -name enginehost-release.json -o -name enginehost-component.json \) -print -quit)"
          python3 - "$envelope" <<'PY'
          import json, sys
          path = sys.argv[1]
          data = json.load(open(path))
          data["channel"] = "stable"
          json.dump(data, open(path, "w"), sort_keys=True, separators=(",", ":"))
          PY
          if [ -n "$ONLY_64_BIT" ]; then
            notes="The stable build of [\`$SOURCE_TAG\`](../../releases/tag/$SOURCE_TAG), built from \`$commit\`, without its 32-bit libraries, as build $ONLY_64_BIT (Droidtop/tracker#646). Its 64-bit code is byte for byte the code published there. Only the libraries for ABIs other than arm64-v8a and x86_64 are gone, from the bundle and its resource APKs, and the manifest and its v1 signature are new. Install it through Enginehost."
            suffix="64-bit"
          else
            notes="The stable build of [\`$SOURCE_TAG\`](../../releases/tag/$SOURCE_TAG), built from \`$commit\`, re-signed in signature format v1 (Droidtop/tracker#550). Its code and build number are unchanged: the manifest, and every payload file it lists, are byte for byte the ones published there; the bundle now carries \`enginehost-bundle.jws\`, chained to the Enginehost signing root, in place of the legacy signature. Install it through Enginehost."
            suffix="v1-signed"
          fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title ($suffix)" --notes "$notes" --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
      - name: Ask droidtop-platforms to reindex
        env:
          GH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "No PLATFORMS_DISPATCH_TOKEN; the plugins index picks this release up on its schedule."
            exit 0
          fi
          gh api repos/Droidtop/droidtop-platforms/dispatches \
            -f event_type=plugin-published -f "client_payload[repo]=$GITHUB_REPOSITORY"

  rekey:
    if: ${{ inputs.rekey }}
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.work.outputs.tags }}
    steps:
      - name: Check the inputs
        env:
          TOOLING_SHA: ${{ inputs.tooling-sha }}
          SOURCE_TAGS: ${{ inputs.source-tag }}
          TAG: ${{ inputs.tag }}
          ONLY_64_BIT: ${{ inputs.only-64-bit }}
          CERTIFICATE: ${{ inputs.repository-certificate }}
        run: |
          set -euo pipefail
          [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "tooling-sha must be a full commit SHA" >&2; exit 1; }
          [[ "$SOURCE_TAGS" =~ ^[A-Za-z0-9._,\ -]+$ ]] || { echo "bad source-tag list '$SOURCE_TAGS'" >&2; exit 1; }
          [ -z "$TAG$ONLY_64_BIT" ] || { echo "rekey does not combine with tag or only-64-bit" >&2; exit 1; }
          [[ "$CERTIFICATE" =~ ^[A-Za-z0-9._/-]+$ && "$CERTIFICATE" != *..* ]] || { echo "bad certificate path '$CERTIFICATE'" >&2; exit 1; }
      - name: Check out the repository's new signing certificate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: repository
          persist-credentials: false
          sparse-checkout: ${{ inputs.repository-certificate }}
          sparse-checkout-cone-mode: false
      - name: Check out the signing tooling and the pinned root keys
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Droidtop/enginehost
          ref: ${{ inputs.tooling-sha }}
          path: enginehost-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts
            app/src/main/assets/trust
      - name: Re-key each release
        id: work
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINEHOST_CERTIFICATE_KEY_PEM: ${{ secrets.ENGINEHOST_CERTIFICATE_KEY_PEM }}
          SOURCE_TAGS: ${{ inputs.source-tag }}
          CERTIFICATE: repository/${{ inputs.repository-certificate }}
          TRUST_DIR: enginehost-tooling/app/src/main/assets/trust
        run: |
          set -euo pipefail
          test -n "$ENGINEHOST_CERTIFICATE_KEY_PEM" || { echo "::error::ENGINEHOST_CERTIFICATE_KEY_PEM is not set" >&2; exit 1; }
          test -f "$CERTIFICATE" || { echo "::error::$CERTIFICATE is not committed on this ref" >&2; exit 1; }
          test -f "$TRUST_DIR/enginehost-root.pub"
          key="$RUNNER_TEMP/certificate-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s' "$ENGINEHOST_CERTIFICATE_KEY_PEM" > "$key")
          # The new certificate must verify to the new root: a chain still under the old root is no re-key.
          python3 - "$CERTIFICATE" "$TRUST_DIR" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "enginehost-tooling/scripts")
          import bundle_jws
          chain = bundle_jws.pem_certificates(Path(sys.argv[1]).read_text())
          new = bundle_jws.pinned_roots(Path(sys.argv[2]))[0]
          assert new.not_after is None, "the first pinned root is not the current one"
          bundle_jws.verify_chain(chain[:3], "plugin", new)
          print("the committed certificate ends at the new root")
          PY
          if [ "$SOURCE_TAGS" = all ]; then
            tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name')"
          else
            tags="$(printf '%s' "$SOURCE_TAGS" | tr ',' ' ' | xargs -n1)"
          fi
          mkdir -p output
          done_tags=""
          for tag in $tags; do
            [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad tag '$tag'" >&2; exit 1; }
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            if printf '%s' "$release" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)["draft"] else 1)'; then
              echo "::notice::$tag is a draft; skipped."; continue
            fi
            printf '%s' "$release" | python3 -c 'import json,sys; [print(a["id"], a["name"]) for a in json.load(sys.stdin)["assets"]]' > "$RUNNER_TEMP/assets.txt"
            if ! grep -q ' [A-Za-z0-9._-]*\.enginehost\.tar\.xz$' "$RUNNER_TEMP/assets.txt"; then
              echo "::notice::$tag carries no bundle asset (*.enginehost.tar.xz); nothing to re-key, left as it is."; continue
            fi
            mkdir -p "source/$tag" "output/$tag"
            while read -r id name; do
              case "$name" in
                *.enginehost.tar.xz|enginehost-release.json|enginehost-component.json)
                  [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad asset name '$name'" >&2; exit 1; }
                  gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "source/$tag/$name" ;;
              esac
            done < "$RUNNER_TEMP/assets.txt"
            skip=""
            for bundle in source/$tag/*.enginehost.tar.xz; do
              [ "$(tar -tJf "$bundle" | sed -n 2p)" = enginehost-bundle.jws ] || skip="$bundle"
            done
            if [ -n "$skip" ]; then
              echo "::warning::$tag: $(basename "$skip") carries no v1 signature, so there is none to re-key; the release is left as it is (it needs a re-sign without rekey)."
              continue
            fi
            envelope="$(find "source/$tag" \( -name enginehost-release.json -o -name enginehost-component.json \) -print -quit)"
            for bundle in source/$tag/*.enginehost.tar.xz; do
              args=()
              [ -z "$envelope" ] || args=(--release-envelope "$envelope")
              python3 enginehost-tooling/scripts/resign-engine-bundle.py "$bundle" \
                --certificate-key "$key" --certificate-chain "$CERTIFICATE" --output "output/$tag" --rekey "${args[@]}"
              [ -z "$envelope" ] || envelope="output/$tag/$(basename "$envelope")"
            done
            for bundle in output/$tag/*.enginehost.tar.xz; do
              python3 enginehost-tooling/scripts/verify-engine-bundle.py "$bundle" --root-key "$TRUST_DIR/enginehost-root.pub"
            done
            cp "$CERTIFICATE" "output/$tag/enginehost-signing-certificate.pem"
            echo "re-keyed $tag"
            done_tags="$done_tags $tag"
          done
          echo "tags=$(echo $done_tags)" >> "$GITHUB_OUTPUT"
          [ -n "$done_tags" ] || echo "::notice::no release had a bundle to re-key; nothing will be uploaded."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rekeyed
          path: output
          if-no-files-found: ignore

  rekey-publish:
    needs: rekey
    if: ${{ inputs.rekey && needs.rekey.outputs.tags != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the signing tooling and the pinned root keys
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Droidtop/enginehost
          ref: ${{ inputs.tooling-sha }}
          path: enginehost-tooling
          persist-credentials: false
          sparse-checkout: |
            scripts
            app/src/main/assets/trust
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rekeyed
          path: output
      - name: Replace the signed assets, one release at a time
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.rekey.outputs.tags }}
          TRUST_DIR: enginehost-tooling/app/src/main/assets/trust
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]]
            # Same tag, same flags: only assets change.
            gh release upload "$tag" "output/$tag"/* --repo "$GITHUB_REPOSITORY" --clobber
            # The legacy key document belongs to the old seed; no official origin uses one.
            old="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name == "enginehost-public-key.json") | .id')"
            [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            # Download what is published now and verify it to the new root before the next release.
            mkdir -p "check/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "check/$tag" --clobber
            for bundle in output/$tag/*.enginehost.tar.xz; do
              name="$(basename "$bundle")"
              cmp "$bundle" "check/$tag/$name"
              python3 enginehost-tooling/scripts/verify-engine-bundle.py "check/$tag/$name" --root-key "$TRUST_DIR/enginehost-root.pub"
            done
            cmp "output/$tag/enginehost-signing-certificate.pem" "check/$tag/enginehost-signing-certificate.pem"
            for envelope in output/$tag/enginehost-release.json output/$tag/enginehost-component.json; do
              [ ! -f "$envelope" ] || cmp "$envelope" "check/$tag/$(basename "$envelope")"
            done
            ! test -e "check/$tag/enginehost-public-key.json"
            echo "$tag: replaced and verified to the new root"
          done
      - name: Ask droidtop-platforms to reindex
        env:
          GH_TOKEN: ${{ secrets.PLATFORMS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "No PLATFORMS_DISPATCH_TOKEN; the plugins index picks the releases up on its schedule."
            exit 0
          fi
          gh api repos/Droidtop/droidtop-platforms/dispatches \
            -f event_type=plugin-published -f "client_payload[repo]=$GITHUB_REPOSITORY"
