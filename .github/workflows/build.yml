name: Android build

on:
  push:
    # main is the mainline (user, 2026-09-24). Until then the work happened
    # on codex/engine-bundles while GitHub's default branch sat stale, so
    # the `latest` tag pointed at a commit the published APK was not built
    # from, and cloud workers or PRs started from the wrong branch.
    branches: [main]
    paths-ignore: ["CLAUDE.md", ".claude/**"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the publish job, which runs no build code, gets
# a token that can write releases (docs/security/2026-09-24-ci-supply-chain.md).
permissions:
  contents: read

# A push that supersedes a running build cancels it, so two builds of the
# same branch never race to publish the rolling release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          # Gradle and its plugins run in this job; they have no business
          # with a git credential.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # The isolated file layer (docs/engine-sandbox.md "Files by path"),
      # end to end on the runner's own libc: the same --wrap list every
      # plugin links with, against a broker over temporary directories.
      - name: Test the native sandbox layers
        run: sh app/src/test/native/run.sh "$RUNNER_TEMP/enginehost-vfs-test"

      - name: Restore official Enginehost APK signing subkey
        env:
          ENGINEHOST_ANDROID_KEYSTORE_BASE64: ${{ secrets.ENGINEHOST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ENGINEHOST_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ENGINEHOST_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/enginehost-signing.p12"

      - name: Test and build the release and debug APKs
        env:
          ENGINEHOST_ANDROID_KEYSTORE: ${{ runner.temp }}/enginehost-signing.p12
          ENGINEHOST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ENGINEHOST_ANDROID_KEYSTORE_PASSWORD }}
          ENGINEHOST_ANDROID_KEY_ALIAS: enginehost
          ENGINEHOST_ANDROID_KEY_PASSWORD: ${{ secrets.ENGINEHOST_ANDROID_KEYSTORE_PASSWORD }}
          # A plain monotonic integer (per workflow file), read by
          # app/build.gradle.kts as the versionCode so newer builds are
          # newer to Android and to the in-app update check.
          VERSION_REVISION: ${{ github.run_number }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Read the app version
        id: version
        run: echo "name=$(sed -n 's/^enginehost\.version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

  publish:
    # Two releases from one mechanism (build-scripts/release_channel.py,
    # ported from droidtop's; Droidtop/tracker#122): a permanent, never
    # overwritten release per green build (publish-build) is Enginehost's
    # build history, and the rolling "latest" release (publish-latest) is
    # the one moving pointer AppUpdate.kt reads. The tag for publish-build
    # is created AT the commit that was built; publish-latest keeps using
    # --target for the same reason the old inline version did: without it
    # gh tags the default branch's head, which for weeks was a stale main,
    # so `latest` named a commit the APK was never built from.
    #
    # Its own job so the write token never shares a runner with Gradle: it
    # downloads the APKs the build job made and runs nothing else.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (release script only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: build-scripts
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enginehost-apks
          path: outputs/apk
      - name: Write release-info.json
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          ENGINEHOST_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          def sha(name):
              return hashlib.sha256(open(name, "rb").read()).hexdigest().upper()
          run = int(os.environ["RUN_NUMBER"])
          json.dump(
              {
                  "formatVersion": 1,
                  "versionCode": run,
                  "versionName": f"{os.environ['ENGINEHOST_VERSION']}-dev.{run}",
                  "apkName": "enginehost-latest.apk",
                  "apkSha256": sha("outputs/apk/release/app-release.apk"),
                  "debugApkName": "enginehost-latest-debug.apk",
                  "debugApkSha256": sha("outputs/apk/debug/app-debug.apk"),
                  "commit": os.environ["COMMIT"],
              },
              open("outputs/release-info.json", "w"),
              indent=2,
          )
          PY
      - name: Publish the permanent per-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 build-scripts/release_channel.py publish-build outputs
      - name: Update the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 build-scripts/release_channel.py publish-latest outputs
