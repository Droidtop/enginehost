name: Android build

on:
  push:
    branches: [main]
    # Prose-only commits do not need an Android build. enginehost
    # carries no .md build inputs, but keep this list explicit
    # anyway so adding one later cannot silently skip CI.
    paths-ignore:
      - "README.md"
  pull_request:
    # Prose-only commits do not need an Android build. enginehost
    # carries no .md build inputs, but keep this list explicit
    # anyway so adding one later cannot silently skip CI.
    paths-ignore:
      - "README.md"
  workflow_dispatch:

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and pull requests never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: enginehost-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
