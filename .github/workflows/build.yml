name: Android build

on:
  push:
    # main is the mainline (user, 2026-09-24). Until then the work happened
    # on codex/engine-bundles while GitHub's default branch sat stale, so
    # the `latest` tag pointed at a commit the published APK was not built
    # from, and cloud workers or PRs started from the wrong branch.
    branches: [main]
    paths-ignore: ["CLAUDE.md", ".claude/**"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the publish job, which runs no build code, gets
# a token that can write releases (docs/security/2026-09-24-ci-supply-chain.md).
permissions:
  contents: read

# A push that supersedes a running build cancels it, so two builds of the
# same branch never race to publish the rolling release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          # Gradle and its plugins run in this job; they have no business
          # with a git credential.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore official Enginehost APK signing subkey
        env:
          ENGINEHOST_ANDROID_KEYSTORE_BASE64: ${{ secrets.ENGINEHOST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ENGINEHOST_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ENGINEHOST_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/enginehost-signing.p12"

      - name: Test and build the release and debug APKs
        env:
          ENGINEHOST_ANDROID_KEYSTORE: ${{ runner.temp }}/enginehost-signing.p12
          ENGINEHOST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ENGINEHOST_ANDROID_KEYSTORE_PASSWORD }}
          ENGINEHOST_ANDROID_KEY_ALIAS: enginehost
          ENGINEHOST_ANDROID_KEY_PASSWORD: ${{ secrets.ENGINEHOST_ANDROID_KEYSTORE_PASSWORD }}
          # A plain monotonic integer (per workflow file), read by
          # app/build.gradle.kts as the versionCode so newer builds are
          # newer to Android and to the in-app update check.
          VERSION_REVISION: ${{ github.run_number }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enginehost-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Read the app version
        id: version
        run: echo "name=$(sed -n 's/^enginehost\.version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

  publish:
    # Same shape as droidtop's: a permanent, linkable "give this to
    # someone to install" release that always points at the newest
    # build of the mainline, main. The tag is created AT the commit that
    # was built (--target): without it gh tags the default branch's
    # head, which for weeks was a stale main, so `latest` named a commit
    # the APK was never built from.
    #
    # release-info.json is the in-app update check's one probe: the
    # app downloads this small file unauthenticated, compares
    # versionCode with its own, and verifies any downloaded APK
    # against apkSha256 before handing it to the Android installer
    # (see AppUpdate.kt).
    #
    # Its own job so the write token never shares a runner with Gradle:
    # it downloads the APKs the build job made and runs nothing else.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enginehost-apks
          path: apks
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          ENGINEHOST_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # The download is the release build. The debug build rides beside
          # it for test rigs (it carries the adb bundle-install harness); an
          # install updates to the build type it already is (AppUpdate.kt).
          cp "$(find apks -name app-release.apk -print -quit)" enginehost-latest.apk
          cp "$(find apks -name app-debug.apk -print -quit)" enginehost-latest-debug.apk
          python3 - <<'PY'
          import hashlib, json, os
          def sha(name):
              return hashlib.sha256(open(name, "rb").read()).hexdigest().upper()
          run = int(os.environ["RUN_NUMBER"])
          json.dump(
              {
                  "formatVersion": 1,
                  "versionCode": run,
                  "versionName": f"{os.environ['ENGINEHOST_VERSION']}-dev-{run}",
                  "apkName": "enginehost-latest.apk",
                  "apkSha256": sha("enginehost-latest.apk"),
                  "debugApkName": "enginehost-latest-debug.apk",
                  "debugApkSha256": sha("enginehost-latest-debug.apk"),
                  "commit": os.environ["COMMIT"],
              },
              open("release-info.json", "w"),
              indent=2,
          )
          PY
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest enginehost-latest.apk enginehost-latest-debug.apk release-info.json \
            --target "$COMMIT" \
            --title "Enginehost — latest build" \
            --notes "Automatically built from commit $COMMIT (build $RUN_NUMBER). enginehost-latest.apk is the release build; enginehost-latest-debug.apk is the debug build for test rigs. Both are signed with the persistent Enginehost CI key, so either installs over a previous one without uninstalling. release-info.json is what the in-app update check reads."
