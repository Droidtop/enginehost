name: Build Godot 4.7.1 plugin

on:
  push:
    branches: [main]
    paths: ["plugins/godot/**", ".github/workflows/plugin-godot.yml"]
  pull_request:
    paths: ["plugins/godot/**", ".github/workflows/plugin-godot.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One agent push supersedes the previous one instead of racing it. Before
# this, every push queued another full build and nothing cancelled the run
# it had just obsoleted, so a five-push fix session burned five builds and
# could email five failures for one problem. Keyed on the ref, so branches
# and pull requests never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build plugin against official Godot AAR
        run: ./gradlew -p plugins/godot :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-plugin-godot-4.7.1-debug-apk
          path: plugins/godot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
