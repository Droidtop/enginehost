name: Build Godot 4.7.1 plugin

on:
  push:
    branches: [main]
    paths: ["plugins/godot/**", ".github/workflows/plugin-godot.yml"]
  pull_request:
    paths: ["plugins/godot/**", ".github/workflows/plugin-godot.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build plugin against official Godot AAR
        run: ./gradlew -p plugins/godot :app:assembleDebug --stacktrace
      - name: Verify packaged plugin contract
        run: bash scripts/verify-plugin-apk.sh plugins/godot/app/build/outputs/apk/debug/app-debug.apk godot
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-plugin-godot-4.7.1-debug-apk
          path: plugins/godot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
