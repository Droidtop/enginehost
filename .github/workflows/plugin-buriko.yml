name: Build experimental Buriko OpenBGI plugin

on:
  push:
    branches: [main]
    paths: ["plugins/buriko/**", ".github/workflows/plugin-buriko.yml", "scripts/verify-plugin-apk.sh"]
  pull_request:
    paths: ["plugins/buriko/**", ".github/workflows/plugin-buriko.yml", "scripts/verify-plugin-apk.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restore pinned interpreter and SDL sources
        run: |
          git clone https://github.com/Cytlan/openbgi.git .ci/openbgi
          git -C .ci/openbgi checkout e2500e0badd04aab472e4620477747973e5e5544
          git -C .ci/openbgi apply "$GITHUB_WORKSPACE/plugins/buriko/openbgi-android.patch"
          git clone --branch release-2.32.10 --depth 1 https://github.com/libsdl-org/SDL.git .ci/SDL
          mkdir -p plugins/buriko/app/src/main/cpp/vendor plugins/buriko/app/src/main/java/org/libsdl/app
          cp -a .ci/openbgi plugins/buriko/app/src/main/cpp/vendor/openbgi
          cp -a .ci/SDL plugins/buriko/app/src/main/cpp/vendor/SDL
          cp .ci/SDL/android-project/app/src/main/java/org/libsdl/app/*.java \
            plugins/buriko/app/src/main/java/org/libsdl/app/
      - name: Build native OpenBGI APK
        run: ./gradlew -p plugins/buriko :app:assembleDebug --stacktrace
      - name: Verify packaged plugin contract
        run: bash scripts/verify-plugin-apk.sh plugins/buriko/app/build/outputs/apk/debug/app-debug.apk buriko
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-plugin-buriko-openbgi-debug-apk
          path: plugins/buriko/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
