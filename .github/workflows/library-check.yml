name: Library check

# A shared library's CI calls this with the commit it is testing (Droidtop/tracker#867 D2: "each repo's CI
# builds and tests every app that uses it"). It builds Enginehost's main with that one vendored library
# moved to the commit: the unit tests and the debug APK, as build.yml makes them, without the release
# signing a library has no business with. Enginehost keeps the knowledge of how it builds; a library only
# names its submodule and its commit:
#
#   enginehost:
#     uses: Droidtop/enginehost/.github/workflows/library-check.yml@main
#     with:
#       submodule: vendor/lib-net
#       ref: ${{ github.sha }}
#       repository: Droidtop/lib-net   # only while the submodule still points at the library's old repository
#
# Started by hand (workflow_dispatch), it builds the branch it is started on instead of main.
on:
  workflow_call:
    inputs:
      submodule:
        description: The library's submodule path, under vendor/
        type: string
        required: true
      ref:
        description: The library commit to build Enginehost against
        type: string
        required: true
      repository:
        description: Where that commit is, as owner/name, when it is not the submodule's own remote (a library that is moving repositories)
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      submodule:
        description: The library's submodule path, under vendor/
        type: string
        required: true
      ref:
        description: The library commit to build Enginehost against
        type: string
        required: true
      repository:
        description: Where that commit is, as owner/name, when it is not the submodule's own remote (a library that is moving repositories)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Enginehost (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Called from a library, github.repository is the library's, so name Enginehost and its main.
          repository: Droidtop/enginehost
          ref: ${{ github.repository == 'Droidtop/enginehost' && github.ref || 'main' }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Move the library to the commit under test
        env:
          SUBMODULE: ${{ inputs.submodule }}
          REF: ${{ inputs.ref }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -eu
          case "$SUBMODULE" in vendor/*) ;; *) echo "submodule must be under vendor/" >&2; exit 1;; esac
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk -v s="$SUBMODULE" '$2 == s { f = 1 } END { exit !f }' \
            || { echo "$SUBMODULE is not one of Enginehost's submodules" >&2; exit 1; }
          echo "pinned: $(git -C "$SUBMODULE" rev-parse HEAD)"
          from=origin
          if [ -n "$REPOSITORY" ]; then
            case "$REPOSITORY" in Droidtop/*|bi0shacker001/*) ;; *) echo "repository must be Droidtop's or bi0shacker001's" >&2; exit 1;; esac
            from="https://github.com/$REPOSITORY"
          fi
          git -C "$SUBMODULE" fetch --depth=1 "$from" "$REF"
          git -C "$SUBMODULE" checkout --quiet --detach FETCH_HEAD
          echo "under test: $(git -C "$SUBMODULE" log -1 --format='%H %s')"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unit tests and the debug build
        run: ./gradlew :app:testDebugUnitTest :plugin-web:testDebugUnitTest :app:assembleDebug --stacktrace
