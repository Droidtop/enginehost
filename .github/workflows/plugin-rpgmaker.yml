name: Build unified RPG Maker plugin

on:
  push:
    branches: [main]
    paths: ["plugins/rpgmaker/**", ".github/workflows/plugin-rpgmaker.yml"]
  pull_request:
    paths: ["plugins/rpgmaker/**", ".github/workflows/plugin-rpgmaker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restore pinned GPL Android runtime source
        run: |
          git clone https://github.com/thehatkid/mkxp-z-android.git .ci/rpgmaker
          git -C .ci/rpgmaker checkout 468fe8128a40cc7d2cba4ac7fbe21a82787de255
          git -C .ci/rpgmaker apply "$GITHUB_WORKSPACE/plugins/rpgmaker/mkxp-z-android-enginehost.patch"
      - name: Fetch upstream-pinned native dependencies
        working-directory: .ci/rpgmaker/app/jni
        run: |
          sed -i 's#https://github.com/freedesktop/uchardet#https://gitlab.freedesktop.org/uchardet/uchardet.git#' get_deps.sh
          sed -i 's#https://github.com/freedesktop/pixman#https://gitlab.freedesktop.org/pixman/pixman.git#' get_deps.sh
          bash -e ./get_deps.sh
      - name: Cross-compile pinned support libraries
        working-directory: .ci/rpgmaker/app/jni
        run: |
          make all ARCH=linux-x86_64 ABI=armeabi-v7a HOST=armv7a-linux-androideabi TARGET=arm-linux-androideabi
          make all ARCH=linux-x86_64 ABI=arm64-v8a HOST=aarch64-linux-android TARGET=aarch64-linux-android
      - name: Build native RGSS and HTML5 APK
        working-directory: .ci/rpgmaker
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Verify packaged plugin contracts
        run: |
          for apk in .ci/rpgmaker/app/build/outputs/apk/debug/*.apk; do
            bash scripts/verify-plugin-apk.sh "$apk" rpgmaker
          done
      - uses: actions/upload-artifact@v4
        with:
          name: enginehost-plugin-rpgmaker-debug-apks
          path: .ci/rpgmaker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
