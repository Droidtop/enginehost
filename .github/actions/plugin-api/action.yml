name: Enginehost plugin API
description: >-
  Checks out Enginehost's plugin API (plugin-api/) at the commit this action is pinned to, for a
  plugin to compile against. The one copy of the API every plugin builds with (Droidtop/tracker#768):
  a plugin repository pins this action by commit, as it pins the signing workflow, and commits no
  copy of the API of its own.
inputs:
  path:
    description: Where the plugin-api folder goes, relative to the workspace.
    default: build/enginehost
runs:
  using: composite
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: Droidtop/enginehost
        # The commit the caller pinned this action to: the API and the action always match.
        ref: ${{ github.action_ref }}
        path: ${{ inputs.path }}
        sparse-checkout: plugin-api
        sparse-checkout-cone-mode: true
        persist-credentials: false
    - shell: bash
      run: test -f "${{ inputs.path }}/plugin-api/src/main/java/dev/enginehost/api/EnginePlugin.java"
