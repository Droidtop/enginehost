name: Enginehost plugin API
description: >-
  Checks out Enginehost's plugin API (plugin-api/) and its web game host (plugin-web/) at the commit
  this action is pinned to, for a plugin to compile against. The one copy of each every plugin builds
  with (Droidtop/tracker#768): a plugin repository pins this action by commit, as it pins the signing
  workflow, and commits no copy of its own. A web core compiles plugin-web/ into its own dex.
inputs:
  path:
    description: Where the plugin-api and plugin-web folders go, relative to the workspace.
    default: build/enginehost
runs:
  using: composite
  steps:
    # The commit the caller pinned this action to, read in a step of the action's own: inside
    # the checkout step's inputs, github.action_ref names actions/checkout's ref instead.
    - id: pin
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: echo "ref=$ACTION_REF" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: Droidtop/enginehost
        # The API and the action always match.
        ref: ${{ steps.pin.outputs.ref }}
        path: ${{ inputs.path }}
        sparse-checkout: |
          plugin-api
          plugin-web
        sparse-checkout-cone-mode: true
        persist-credentials: false
    - shell: bash
      env:
        CHECKOUT: ${{ inputs.path }}
      run: |
        test -f "$CHECKOUT/plugin-api/src/main/java/dev/enginehost/api/EnginePlugin.java"
        test -f "$CHECKOUT/plugin-web/src/main/java/dev/enginehost/web/GameServer.java"
